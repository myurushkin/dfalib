# Example dafna config. Run with:  dafna run example.conf
# Anything after a '#' is a comment.

# --- Built-in DNA secondary structures ---

&GQD T                      # G-quadruplexes (T = enabled, F/omitted = disabled)
TOP=all                     # 'all', or a list e.g. [canonical,tandem]
STR_MIN=2                   # min strength (default 2)
STR_MAX=3                   # max strength (default 5)
&END

&IMT T                      # i-motifs
TOP=all
STR_MIN=2
STR_MAX=3
&END

&HRP T                      # hairpins
STR_MIN=2
STR_MAX=3
&END

&TRX T                      # triplexes
STR_MIN=2
STR_MAX=3
&END

# --- User-defined structure (no code needed) ---
# {s} = strength, expanded to literal repetition. Disabled here (flag F).

&CUSTOM myquad F
PATTERN=X* g{s} X+ g{s} X+ g{s} X+ g{s} X*
STR_MIN=2
STR_MAX=3
# SIMPLE=Z:a|c              # optional extra simple pattern(s) usable in PATTERN
&END

# --- General settings ---

&GEN
PROJECT=demo                # project name; printed with the date on the first log line
MODE=gen                    # 'gen' (enumerate strings) or 'scan' (analyse IN)
LEN=MIN                     # string length, an integer or MIN for the shortest
# IN=input.fa               # input sequence for MODE=scan (FASTA or plain text)
# OUT=out.log               # output file; defaults to stdout when unset
# PLUGIN=example_plugin.py  # import Python plugin(s) that register() structures
NCPU=1                      # reserved: thread count (lib not parallelised yet)
# MEM=4GB                   # reserved: memory budget
&END
